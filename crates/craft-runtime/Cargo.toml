[package]
name = "craft-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
craft-core = { path = "../craft-core", version = "0.0.14" }
craft-redact = { path = "../craft-redact", version = "0.0.14" }
craft-tools = { path = "../craft-tools", version = "0.0.14" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror.workspace = true
futures = { version = "0.3", default-features = false, features = ["std", "alloc"] }
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
craft-providers = { path = "../craft-providers", version = "0.0.14" }
tokio = { version = "1", features = ["macros", "rt", "test-util"] }
futures = { version = "0.3", features = ["std", "alloc"] }
