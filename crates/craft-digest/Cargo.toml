[package]
name = "craft-digest"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
craft-core = { path = "../craft-core", version = "0.0.12" }
craft-runtime = { path = "../craft-runtime", version = "0.0.12" }
craft-tools = { path = "../craft-tools", version = "0.0.12" }
regex = "1"
serde_json = "1"
thiserror.workspace = true

[dev-dependencies]
futures = { version = "0.3", default-features = false, features = ["std", "alloc"] }
tokio = { version = "1", features = ["macros", "rt"] }
