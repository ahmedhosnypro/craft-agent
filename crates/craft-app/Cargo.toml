[package]
name = "craft-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
name = "craft_app"
path = "src/lib.rs"

[[bin]]
name = "craft-agent"
path = "src/main.rs"

[dependencies]
clap.workspace = true
thiserror.workspace = true
craft-core = { path = "../craft-core", version = "0.0.12" }
craft-digest = { path = "../craft-digest", version = "0.0.12" }
craft-providers = { path = "../craft-providers", version = "0.0.12" }
craft-redact = { path = "../craft-redact", version = "0.0.12" }
craft-runtime = { path = "../craft-runtime", version = "0.0.12" }
craft-tools = { path = "../craft-tools", version = "0.0.12" }
craft-workflow = { path = "../craft-workflow", version = "0.0.12" }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }

[dev-dependencies]
futures = { version = "0.3", default-features = false, features = ["std", "alloc"] }
