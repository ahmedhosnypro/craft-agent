[package]
name = "craft-providers"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
craft-core = { path = "../craft-core", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["stream", "native-tls-vendored"] }
futures = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "net", "io-util", "time", "test-util"] }
