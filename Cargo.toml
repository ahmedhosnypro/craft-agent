[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/*"]

[workspace.package]
version = "0.0.12"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.98"
repository = "https://github.com/ahmedhosnypro/craft-agent"

# A crate adopts a workspace entry only when its code first references it.
[workspace.dependencies]
thiserror = "2"
clap = { version = "4", features = ["derive"] }
aho-corasick = "1"
regex = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "deny"

# Line tables keep backtrace file:line; the dbg profile is the full-debuginfo opt-in.
[profile.dev]
debug = "line-tables-only"

# Full debuginfo for a debugging session.
[profile.dbg]
inherits = "dev"
debug = "full"

# "*" matches dependencies only, never workspace members.
[profile.dev.package."*"]
debug = false
