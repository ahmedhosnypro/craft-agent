# The release pipeline. A pushed semver tag (or a dispatch naming an
# existing one) builds the Linux binaries natively, one runner per
# arch; a single release job assembles dist/, publishes draft-first so
# a failed run never leaves a partial release, then repoints the
# moving major tag (v1, v2, …) matching the release at the release commit.
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v1.2.3)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.target }})
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref_name != 'v1' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - name: Checkout the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 1
      - name: Ensure the musl target
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            export PATH="${HOME}/.cargo/bin:${PATH}"
            echo "${HOME}/.cargo/bin" >> "$GITHUB_PATH"
          fi
          rustup target add "$TARGET"
      - name: Provision the musl C toolchain
        run: |
          set -euo pipefail
          # openssl-sys probes the target-prefixed gcc name; musl-tools ships
          # only the musl-gcc wrapper. The ARM runner cannot run musl.cc's
          # x86_64-hosted cross builds — it gets the aarch64-hosted native one.
          case "$TARGET" in
            x86_64-unknown-linux-musl)
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends musl-tools
              sudo ln -sf "$(command -v musl-gcc)" /usr/local/bin/x86_64-linux-musl-gcc
              ;;
            aarch64-unknown-linux-musl)
              url="https://musl.cc/aarch64-linux-musl-native.tgz"
              if ! (
                curl --head -fsSL -m 30 "$url" -o /dev/null &&
                curl -fsSL "$url" -o /tmp/aarch64-musl-native.tgz &&
                echo "daf336cafa2c3c7daf42f6a46edc960f10a181fcf15ab9f1c43b192e8ad2a069  /tmp/aarch64-musl-native.tgz" |
                  sha256sum --check --status
              ); then
                echo "musl.cc fetch failed — falling back to apt musl-tools"
                sudo apt-get update
                sudo apt-get install -y --no-install-recommends musl-tools
                sudo ln -sf "$(command -v musl-gcc)" /usr/local/bin/aarch64-linux-musl-gcc
              else
                sudo mkdir -p /opt/musl-cross
                sudo tar -xzf /tmp/aarch64-musl-native.tgz -C /opt/musl-cross
                echo "/opt/musl-cross/aarch64-linux-musl-native/bin" >> "$GITHUB_PATH"
                export PATH="/opt/musl-cross/aarch64-linux-musl-native/bin:$PATH"
              fi
              echo "CC_aarch64_unknown_linux_musl=aarch64-linux-musl-gcc" >> "$GITHUB_ENV"
              echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-musl-gcc" >> "$GITHUB_ENV"
              ;;
          esac
          musl_cc="${TARGET%%-*}-linux-musl-gcc"
          command -v "$musl_cc"
          tmp="$(mktemp -d)"
          printf 'int main(void){return 0;}\n' > "$tmp/hello.c"
          "$musl_cc" -static -o "$tmp/hello" "$tmp/hello.c"
          "$tmp/hello"
      - name: Test
        run: cargo test --workspace
      - name: Build
        run: cargo build --release --locked -p craft-app -p craft-helpers --target "$TARGET"
      - name: Stage dist
        run: |
          set -euo pipefail
          install -m 0755 "target/${TARGET}/release/craft-agent" "dist/craft-agent-${TARGET}"
          install -m 0755 "target/${TARGET}/release/craft-helpers" "dist/craft-helpers-${TARGET}"
      - name: Upload the binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-binaries-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Mint the release token
        id: release-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.CRAFT_AGENT_APP_CLIENT_ID }}
          private-key: ${{ secrets.CRAFT_AGENT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - name: Checkout the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 1
          token: ${{ steps.release-token.outputs.token }}
      - name: Download the binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-binaries-*
          path: dist
          merge-multiple: true
      - name: Verify the asset set
        run: |
          set -euo pipefail
          test -s dist/craft-agent-x86_64-unknown-linux-musl
          test -s dist/craft-agent-aarch64-unknown-linux-musl
          test -s dist/craft-helpers-x86_64-unknown-linux-musl
          test -s dist/craft-helpers-aarch64-unknown-linux-musl
      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum craft-agent-x86_64-unknown-linux-musl \
                     craft-agent-aarch64-unknown-linux-musl \
                     craft-helpers-x86_64-unknown-linux-musl \
                     craft-helpers-aarch64-unknown-linux-musl > checksums.txt
          sha256sum --check checksums.txt --ignore-missing
      - name: Publish the release
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --draft --verify-tag \
              --title "craft-agent $TAG" --generate-notes
          fi
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" \
            dist/craft-agent-x86_64-unknown-linux-musl \
            dist/craft-agent-aarch64-unknown-linux-musl \
            dist/craft-helpers-x86_64-unknown-linux-musl \
            dist/craft-helpers-aarch64-unknown-linux-musl \
            dist/checksums.txt --clobber
          gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --draft=false
      - name: Move the major tag
        run: |
          set -euo pipefail
          case "$TAG" in
            *-*) echo "pre-release tag ${TAG} — moving tag left untouched" ;;
            v[0-9]*.*.*)
              major="${TAG%%.*}"
              git tag -f "$major" "$(git rev-parse HEAD)"
              git push -f origin "$major"
              ;;
            *)
              echo "unrecognized tag shape ${TAG} — moving tag left untouched"
              ;;
          esac
