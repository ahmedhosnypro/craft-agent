# The daily suite digest. Scheduled runs stay dormant until the
# DIGEST_ENABLED repository variable is "true"; workflow_dispatch always
# runs. Two jobs with separate App tokens: digest reads the org (provider
# key present, no issue writing), publish writes one sticky issue (no
# provider key). The artifact is the only thing that crosses jobs.
name: suite-digest

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      since:
        description: Window start (Nd or YYYY-MM-DD). Defaults to the sticky issue's window marker.
        required: false
        type: string
      dry-run:
        description: Run the digest but publish nothing.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: suite-digest
  cancel-in-progress: false

env:
  DIGEST_TITLE: Suite digest
  DIGEST_ORG: storytold
  DIGEST_REPO: craft-agent

jobs:
  digest:
    # The schedule guard: the workflow ships before the App and secrets
    # exist, so cron runs stay dormant until DIGEST_ENABLED is "true".
    if: ${{ github.event_name != 'schedule' || vars.DIGEST_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Pin the digest token to the repositories it reads
        id: pin
        run: |
          set -euo pipefail
          repos="$( { grep -vE '^[[:space:]]*(#|$)' config/digest-repos.txt; echo "${DIGEST_REPO}"; } | sort -u )"
          {
            echo "repositories<<EOF"
            printf '%s\n' "$repos"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Mint the digest token
        id: digest-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.CRAFT_AGENT_APP_CLIENT_ID }}
          private-key: ${{ secrets.CRAFT_AGENT_APP_PRIVATE_KEY }}
          owner: ${{ env.DIGEST_ORG }}
          repositories: ${{ steps.pin.outputs.repositories }}
          permission-contents: read
          permission-issues: read
      - name: Derive the digest window
        id: window
        env:
          GH_TOKEN: ${{ steps.digest-token.outputs.token }}
          SINCE_OVERRIDE: ${{ inputs.since }}
        run: |
          set -euo pipefail
          repo="${DIGEST_ORG}/${DIGEST_REPO}"
          if [ -n "${SINCE_OVERRIDE:-}" ]; then
            echo "since=${SINCE_OVERRIDE}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! issues="$(gh issue list -R "$repo" --state all \
              --search "${DIGEST_TITLE} in:title author:app/craft-agent" \
              --json number,title,body --limit 50)"; then
            echo "::error::could not list the sticky digest issue to derive the window"
            exit 1
          fi
          body="$(jq -r --arg title "$DIGEST_TITLE" \
            'map(select(.title == $title)) | sort_by(.number) | reverse | .[0].body // ""' <<<"$issues")"
          end="$(grep -oE 'digest-window: [0-9]{4}-[0-9]{2}-[0-9]{2}\.\.\.[0-9]{4}-[0-9]{2}-[0-9]{2}' <<<"$body" \
            | tail -n 1 | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}$' || true)"
          if [ -z "$end" ] || ! date -u -d "$end" >/dev/null 2>&1; then
            echo "::warning::no usable window marker in the sticky digest issue — using a 24h fallback window"
            end="$(date -u -d '1 day ago' +%F)"
          fi
          cutoff="$(date -u -d '30 days ago' +%F)"
          if [[ "$end" < "$cutoff" ]]; then
            echo "::warning::window start ${end} is older than 30 days — clamped to ${cutoff}"
            end="$cutoff"
          fi
          echo "since=${end}" >> "$GITHUB_OUTPUT"
      - name: Install the copy-paste detector
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: jscpd@5.4.0
      - name: Digest the suite
        id: agent
        uses: ./
        with:
          mission: digest
          version: v1
          provider: ${{ vars.CRAFT_AGENT_PROVIDER }}
          model: ${{ vars.CRAFT_AGENT_MODEL }}
          args: "--org ${{ env.DIGEST_ORG }} --since ${{ steps.window.outputs.since }}${{ inputs.dry-run && ' --dry-run' || '' }}"
          github-token: ${{ steps.digest-token.outputs.token }}
        # Provider keys live only in this step's env; the binary reads the
        # one matching the provider input and never passes any of them on
        # to child processes.
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      - name: Upload the digest
        if: ${{ steps.agent.outputs.conclusion == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest
          path: ${{ steps.agent.outputs.digest-path }}
          if-no-files-found: error

  publish:
    needs: digest
    # Runs on success and failure alike (a timeout-cancelled digest still
    # gets its failure note); skipped when the digest job was guarded out
    # or the run is a dry run.
    if: ${{ always() && inputs.dry-run != true && needs.digest.result != 'skipped' && (github.event_name != 'schedule' || vars.DIGEST_ENABLED == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mint the publish token
        id: publish-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.CRAFT_AGENT_APP_CLIENT_ID }}
          private-key: ${{ secrets.CRAFT_AGENT_APP_PRIVATE_KEY }}
          owner: ${{ env.DIGEST_ORG }}
          repositories: ${{ env.DIGEST_REPO }}
          permission-issues: write
      - name: Download the digest artifact
        if: ${{ needs.digest.result == 'success' }}
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digest
          path: ${{ runner.temp }}/digest-artifact
      - name: Publish the sticky digest issue
        env:
          GH_TOKEN: ${{ steps.publish-token.outputs.token }}
          DIGEST_RESULT: ${{ needs.digest.result }}
          DIGEST_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ARTIFACT_DIR: ${{ runner.temp }}/digest-artifact
        run: |
          set -euo pipefail
          repo="${DIGEST_ORG}/${DIGEST_REPO}"
          if ! issues="$(gh issue list -R "$repo" --state all \
              --search "${DIGEST_TITLE} in:title author:app/craft-agent" \
              --json number,title,state --limit 50)"; then
            echo "::error::could not list the sticky digest issue"
            exit 1
          fi
          number="$(jq -r --arg title "$DIGEST_TITLE" \
            'map(select(.title == $title)) | sort_by(.number) | reverse | .[0].number // ""' <<<"$issues")"
          digest_file=""
          if [ -d "$ARTIFACT_DIR" ]; then
            digest_file="$(find "$ARTIFACT_DIR" -type f -name 'digest.md' | head -n 1 || true)"
          fi
          if [ "$DIGEST_RESULT" = "success" ] && [ -n "$digest_file" ]; then
            if [ -n "$number" ]; then
              gh issue edit "$number" -R "$repo" --body-file "$digest_file"
              state="$(jq -r --argjson n "$number" \
                'map(select(.number == $n)) | .[0].state // "OPEN"' <<<"$issues")"
              if [ "$state" = "CLOSED" ]; then
                gh issue reopen "$number" -R "$repo"
              fi
            else
              gh issue create -R "$repo" --title "$DIGEST_TITLE" --body-file "$digest_file" >/dev/null
            fi
            exit 0
          fi
          # Failure-note path: the issue body and its window marker are
          # never touched here — only a dated comment is appended, so the
          # next run still derives its window from the last good digest.
          note="${RUNNER_TEMP}/failure-note.md"
          {
            echo "### No digest published — $(date -u +'%Y-%m-%d %H:%M UTC')"
            echo
            echo "The digest run ended with result \`${DIGEST_RESULT}\` and produced no digest to publish."
            echo
            echo "Run log: ${DIGEST_RUN_URL}"
            echo
            echo "The digest in this issue is unchanged; the next run re-collects from the window marker in the issue body."
          } > "$note"
          if [ -z "$number" ]; then
            placeholder="${RUNNER_TEMP}/placeholder-body.md"
            {
              echo "This issue carries the daily storytold suite digest."
              echo
              echo "No digest has been published yet."
            } > "$placeholder"
            created="$(gh issue create -R "$repo" --title "$DIGEST_TITLE" --body-file "$placeholder")"
            number="$(grep -oE '[0-9]+$' <<<"$created")"
          fi
          gh issue comment "$number" -R "$repo" --body-file "$note"
          if [ "$DIGEST_RESULT" = "success" ]; then
            exit 1
          fi
