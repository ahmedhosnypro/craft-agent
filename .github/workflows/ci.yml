# Mirrors the justfile `check` recipe exactly (lockstep law); rustup
# provisions the pinned toolchain from rust-toolchain.toml automatically.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Tooling only, not a gate stage: the supply-chain gates are not
      # preinstalled on hosted runners. Versions match the local pins.
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-deny@0.20.2,cargo-machete@0.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # The live corpora (the justfile `integration*` recipes): runners
      # carry no `.env`, so every corpus SKIPs green.
      - run: cargo test -p craft-providers --test integration -- --ignored --nocapture
      - run: cargo test -p craft-providers --test integration_tools -- --ignored --nocapture
      - run: cargo test -p craft-providers --test integration_stream_tools -- --ignored --nocapture
      - run: cargo test -p craft-providers --test integration_auth -- --ignored --nocapture
      - run: cargo test -p craft-providers --test integration_dialect_mount -- --ignored --nocapture
      - run: cargo test -p craft-runtime --test integration_agent_loop -- --ignored --nocapture
      - run: ./scripts/scan-secrets.sh
      - run: ./scripts/scan-secrets.sh --selftest
      - run: ./scripts/identifier-scan.sh
      - run: ./scripts/identifier-scan.sh --selftest
      - run: ./scripts/check-file-length.sh
      - run: ./scripts/validate-agents.sh
      - run: ./scripts/validate-agents.sh --selftest
      - run: cargo deny --locked check
      - run: cargo machete
      - run: cargo build --locked
