# Mirrors the justfile `check` recipe exactly (lockstep law); rustup
# provisions the pinned toolchain from rust-toolchain.toml automatically.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: ./scripts/scan-secrets.sh
      - run: ./scripts/identifier-scan.sh
